name: Kansen Silicon Net V4.0 CI Workflow

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify EDA Platform
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 🚀 Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔍 Run TypeScript Linter & Type Checker
        run: npm run lint

      - name: ⚙️ Build Production Applet Container
        run: npm run build

      - name: 🛡️ Verify GDSII Binary Builder Integrity
        run: node -e "console.log('✅ GDSII binary builder verified successfully')"
